# Baseline comparison experiment source lock.
#
# All formal baseline runs must be reproducible from this file.  External
# repositories are pinned by commit; the local SkillOpt snapshot (which has no
# .git metadata) is additionally pinned by a complete runtime-tree SHA-256 and
# human-auditable key-file hashes so bootstrap fails closed on any source drift.
schema_version: 1

ours:
  repo: https://github.com/YU-S3/AtomicSkill-ToolGraph_v3
  design_commit: ee2432465831c4a9a60da7102dafec3003d71672

skillopt:
  repo: https://github.com/microsoft/SkillOpt
  commit: 79124b37e9a6371e13b753f8bcd7adb1e493ade1
  version: 0.2.0
  license: MIT
  # Verified against the complete GitHub tree at the declared commit.  The
  # runtime digest binds every file under skillopt/ and configs/, plus the four
  # root packaging/license files. Generated caches and bytecode are excluded.
  local_snapshot_verification: runtime_tree_sha256+key_file_sha256
  runtime_tree:
    algorithm: sha256-path-content-v1
    roots:
      - skillopt
      - configs
    root_files:
      - LICENSE
      - README.md
      - pyproject.toml
      - requirements.txt
    file_count: 155
    sha256: 8f144386812a336ae8f35871c09fb60db6edeb135ac97c02f6baf6adf385cc91
  key_files:
    skillopt/engine/trainer.py: 666fc3d51d797b8e8c183a8eb2a266fafef00848bf4c12fd9de56eb04bf25f7e
    skillopt/envs/base.py: ea8c650e8bce460be047a03183cf17fbc49b436345cd1b1484093f763c6c64d7
    skillopt/envs/alfworld/adapter.py: 15fa76d3e5ad6694a2bbe670b53cab301127493433d2a575f2f02e5e7e98083f
    skillopt/envs/alfworld/rollout.py: eaacb4e895e4b399801b0496ee4cd4de51820a484bfa856e3804f5d47e298a20
    skillopt/envs/alfworld/dataloader.py: 3dff2eb535576c109c770d5a90a7a6e9d9442bd15c8035ff77a3f942766ecb7b
    skillopt/envs/alfworld/skills/initial.md: 01bd29e825b81715e7b592e135a9a9d6d0f812a5e84dcd56b51cc1075247f941
    LICENSE: 9515a04280cf50ce154eb3ab8fa375c7cc5e6b45ea5cb23b7ff3830737020c15
    pyproject.toml: c2a1c6753320b0c77fee66226cdf48ef5690812d52d341087143366f7c69e74c

