[project]
name = "atomic-skillgraph"
version = "3.1.0"
description = "SkillCompiler empirical programs and frozen benchmark evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
alfworld = ["alfworld==0.4.2"]
benchmarks = ["openpyxl==3.1.5", "pyarrow>=19", "Pillow==11.3.0", "iterative-stratification==0.1.9"]
dev = ["pytest>=7.0"]

[project.scripts]
skillcompiler = "atomic_skillgraph.experiments.run_empirical:main"
skillcompiler-pilot = "atomic_skillgraph.experiments.run_empirical_pilot:main"
skillcompiler-acceptance = "atomic_skillgraph.experiments.run_empirical_acceptance:main"
skillcompiler-multibench = "atomic_skillgraph.experiments.run_multibench:main"
skillcompiler-prepare = "atomic_skillgraph.experiments.prepare_benchmarks:main"
skillcompiler-manifest = "atomic_skillgraph.experiments.canonical_manifest:main"
skillcompiler-formal = "atomic_skillgraph.experiments.run_formal:main"
skillcompiler-single-cell = "atomic_skillgraph.experiments.run_single_cell:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"atomic_skillgraph.harness.scorers" = ["LICENSE"]
"skillcompiler_bench_contracts" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
