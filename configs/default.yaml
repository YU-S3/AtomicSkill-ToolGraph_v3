mechanism_profile: skillcompiler.empirical.v1
schema_version: empirical.v1
benchmark_profile: alfworld.public-discovery.v2
manifest: data/baseline_manifests/train_120.json
data_dir: runs/empirical_seed42/bank
experiment:
  implementation_revision: empirical-v3.1-CF3
  seed: 42
