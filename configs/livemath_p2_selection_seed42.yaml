candidate:
  knowledge_type: procedural_advisory
  min_distinct_physical_train_source_cases: 2
  max_evidence_cases_per_candidate: 4
  max_candidates_to_selection: 2
  candidate_order: sort by valid distinct supporting source cases descending, then immutable candidate digest ascending;
    never selection accuracy
  candidate_provenance_required: true
  allow_answer_label_or_case_specific_theorem_as_procedure: false
  program_source_local_qualification_unchanged: true
  do_not_publish_before_selection: true
  no_candidate_means_no_pair_http: true
paired_evaluation:
  source_split: train
  learn: false
  same_public_task_same_model_and_effective_call_settings: true
  only_variable: the candidate procedural Skill visible in the on arm
  candidate_trial_uses_readonly_isolated_snapshot: true
  off_arm_does_not_see_candidate: true
  on_arm_must_record_actual_candidate_injection: true
  preserve_other_programs_and_guidance_in_both_arms: true
  separate_attempt_and_checkpoint_per_candidate_task_arm: true
  no_reuse_old_P1_predicted_answers_as_off_arm: true
  counterbalanced_order: alternate off-on and on-off by selector rank parity; reverse parity for second candidate
  cached_off_arm_reuse: false
  number_of_candidates_that_may_use_selection: 2
  screen:
    min_actual_exposed_tasks: 0
    min_net_correct_on_minus_off: 0
    require_empty_on_not_increase: true
    max_correct_to_wrong_regressions: 1
    otherwise: stop this candidate before confirmation; no promotion
    zero_exposure_handling: skip stage A calls and evaluate stage B only if the 12-task preflight has at least four
      eligible cases
  promotion_after_both_stages:
    min_actual_exposed_tasks_total: 4
    min_net_correct_on_minus_off: 2
    require_empty_on_not_increase: true
    max_correct_to_wrong_regressions: 1
    require_all_source_contracts_valid: true
    no_token_only_promotion: true
    failure: candidate rejected or coverage_insufficient; no automatic threshold/prompt re-selection
  report:
  - per-task win/loss/tie
  - injected candidate IDs
  - valid answer and empty/invalid counts
  - off and on total_tokens, input_tokens, output_tokens and reasoning_tokens when available
  - per-arm physical HTTP/retries
  - readonly Bank/Frozen digests
  - budget stops and unknown billing
  precompute_applicability_for_all_12_from_public_inputs_only: true
  min_precomputed_applicable_tasks_to_attempt_paid_selection: 4
  only_evaluate_eligible_tasks: true
  never_force_candidate_injection_on_nonmatching_task: true
budget_additional_authority_proposed_not_spent:
  max_new_total_tokens: 1800000
  max_new_physical_http_attempts: 80
  model_http_calls_now: 0
  selection_retry_max: 0
  same_original_total_governor_limit_tokens: 23232000
  same_original_total_governor_limit_http: 9165
  historical_cost_inherited_once: true
  unknown_billing: fail_closed
  exhaustion: stop with explicit censored status, no cap reset
interpretation:
  purpose: engineering and developmental Train selection, not statistically significant generalization proof
  existing_P1_Train60_has_already_been_examined: true
  Val17: development-only; never candidate promotion or threshold tuning
  Test100: do not use for this P2 selection or prompt design
  future_claims_require_a_separate_unseen_evaluation: true
