# B5 GEPA formal Protocol-Faithful Matched-Train configuration.
schema_version: 1

method: b5_gepa
protocol_revision: '2.3'
model:
  provider_completion_cap: 65536
protocol_profile: formal_v2
experiment_kind: formal
campaign_id: protocol_faithful_matched_train_v2
worker_python: .venv_b5_gepa/bin/python

train:
  train_size: 120
  validation_size: 24
  seed: 42

gepa:
  candidate_component: skill_text
  candidate_selection_strategy: pareto
  frontier_type: instance
  skip_perfect_score: true
  batch_sampler: epoch_shuffled
  reflection_minibatch_size: 3
  perfect_score: 1.0
  module_selector: round_robin
  use_merge: false
  max_metric_calls: 720
  cache_evaluation: false
  val_evaluation_policy: full_eval
  acceptance_criterion: strict_improvement
  sampling_strategy: null
  selection_strategy: null
  reflection_max_completion_tokens: 16384

provider_transport:
  sdk_max_retries: 0
  application_retry_limit: 5
  retry_delays_seconds: [2, 5, 10, 20]
  deterministic_jitter_ratio: 0.10

provider_probe:
  # Real resident ALFWorld workers + provider load, highest pass BEFORE lock.
  allowed_global_caps: [48, 36, 24]
  memory_reserve_fraction: 0.15
  memory_reserve_min_bytes: 2147483648
  enabled: true
  concurrency: 48
  requests: 96
  max_completion_tokens: 65536
  reasoning_effort: high

resume:
  enabled: true
  authority: gepa_run_dir

parallel:
  seed_lanes: 3
  episode_workers_per_seed: 16
  test_workers_per_seed: 16
  campaign_provider_max_inflight: 48
  mp_start_method: spawn

env:
  name: alfworld
  max_steps: 100
  max_completion_tokens: 16384
  workers: 16
  max_api_workers: 16
