# B3 SkillOpt formal Protocol-Faithful Matched-Train configuration.
# Data authority: Train120 / Validation24 / frozen full Test134.
schema_version: 1

method: b3_skillopt
protocol_profile: formal_v2

train:
  num_epochs: 4
  train_size: 120
  batch_size: 40
  accumulation: 1
  # Overridden by run_method --seed before config_resolved.json is hashed.
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 16
  failure_only: false

optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: true
  slow_update_samples: 20
  longitudinal_pair_policy: mixed
  use_meta_skill: true
  use_skill_aware_reflection: false
  slow_update_gate_with_selection: true

evaluation:
  use_gate: true
  gate_metric: hard
  sel_env_num: 24
  eval_test: false

# Transport-only reliability policy. The OpenAI SDK retry layer is disabled so
# each application attempt is classified and audited exactly once. Transient
# failures are retried; permanent request/auth failures remain fail-closed.
provider_transport:
  sdk_max_retries: 0
  application_retry_limit: 5
  retry_delays_seconds: [2, 5, 10, 20]

# Real-provider preflight. Task success is not a gate: this proves transport,
# exact-gamefile reset, one observed target call, and auditable env actions.
smoke:
  task_count: 2
  max_steps: 2

env:
  name: alfworld
  # Outer environment-action ceiling (§7.1).
  max_steps: 100
  max_completion_tokens: 16384
  # Independent ALFWorld episodes are parallelized only at the rollout batch
  # boundary.  Results are restored to manifest order before SkillOpt sees them.
  workers: 16
  max_api_workers: 16
