# B3 SkillOpt paper-aligned config (baseline design doc section 16.5).
# Every value below is part of the frozen comparison protocol; changing any
# of them invalidates a formal run.
schema_version: 1

method: b3_skillopt

train:
  num_epochs: 4
  batch_size: 40
  accumulation: 1

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 4

optimizer:
  learning_rate: 4
  use_slow_update: true
  use_meta_skill: true
  use_skill_aware_reflection: false
  slow_update_gate_with_selection: true

evaluation:
  use_gate: true

env:
  name: alfworld
  # Outer environment-action ceiling (§7.1).
  max_steps: 100
  max_completion_tokens: 16384
  workers: 1
  max_api_workers: 1
