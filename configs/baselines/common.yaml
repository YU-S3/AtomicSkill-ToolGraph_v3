# Common baseline configuration: frozen model identity and outer protocol.
schema_version: 1

campaign_id: protocol_faithful_matched_train_v2
run_seed: 42
max_environment_actions: 100

# Per-method worker venv (created by bootstrap_external.py --setup-worker-venv).
worker_python: .venv_b3_skillopt/bin/python

model:
  provider: openai_compatible
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash
  api_key_env: MODEL_API_KEY
  reasoning_effort: high

# One formal method campaign may run its three independent seed lanes in
# parallel.  This is only episode/process parallelism; the single campaign
# provider gate below remains the real HTTP concurrency authority.
parallel:
  seed_lanes: 3
  episode_workers_per_seed: 16
  test_workers_per_seed: 16
  skillopt_analyst_workers_per_seed: 16
  campaign_provider_max_inflight: 16
